name: Update tone data and Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "space/app.py", "space/requirements.txt", "space/README.md", ".github/workflows/update.yml"]
  schedule:
    - cron: "0 14 20 * *"   # 20th of each month, after most BOJ decisions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt
      - name: Download statements
        run: python src/fetch.py
      - name: Score sentences
        run: python src/score.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update BOJ tone data" && git push
      - name: Publish Space
        if: ${{ env.HF_TOKEN != '' }}
        run: python src/publish.py
